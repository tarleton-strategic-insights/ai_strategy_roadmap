# Personnel framework: categorizes each unique_items entry by the roles (Leaders and
# Doers) needed to do that work. Sole authoritative definition of personnel categories
# AND membership. This is one of two independent categorization axes — see outcomes.yaml
# for the other (which strategic objective the work serves). An entry gets exactly one
# personnel category and exactly one outcome; the two axes don't have to agree and
# aren't derived from each other.
# Membership is defined at the unique_items (unique_items.yaml) level, not the raw-item
# level: every unique_items entry (X1, X2, ...) belongs to exactly one personnel
# category. Where a unique_items entry's member raw items previously disagreed (e.g. a
# duplicate group mixing a curriculum item with a workforce item), a single category was
# chosen by explicit adjudication (2026-08-11) rather than split across categories.
#
# Restructured 2026-08-12: replaced the structure/content/technical facet profile with
# an explicit Leaders/Doers role breakdown per category — clearer to articulate multiple
# concrete roles within each category than to describe by abstract characteristics.
# Each role has a title, a list of one-line descriptions, and an ai_expertise rating
# (low / medium / high / varies by field, etc — free text).
# `champions` (added 2026-08-12): optional list of named people driving that category
# forward. Not every category has champions named yet ("TBD" is a valid placeholder).

kinds:
  use_cases:
    description: >
      Resourceable work, split by the scarce key personnel each type depends on most.
    types:
      curriculum_integration:
        ordinal: 1   # NOTE: conflicts with PAC bucket 3; see ADR-9 in roadmap/decisions/resolved_decisions.md
        pac_bucket: 3
        label: "Ensure AI Literacy for All Tarleton Graduates"
        champions: ["Barry Lambert", "Denise Martinez"]
        leaders:
          - title: "Provost, deans, department heads"
            descriptions:
              - "Establish academic structure and process (ex: stand-alone AI courses vs. embed AI in all courses vs. embed into capstones)"
            ai_expertise: "low"
        doers:
          - title: "Instructors"
            descriptions:
              - "Design & implement most effective ways to integrate AI within their specific subject"
            ai_expertise: "varies by field"
        items: [X1, X9]
      workforce_development:
        ordinal: 2   # NOTE: conflicts with PAC bucket 1; see ADR-9 in roadmap/decisions/resolved_decisions.md
        pac_bucket: 1
        label: "Equip our faculty and staff to use AI effectively and responsibly"
        champions: ["TBD"]
        leaders:
          - title: "Coordinator"
            descriptions:
              - "Organize & support training for all staff AND faculty (and possibly alumni, community partners, etc)"
            ai_expertise: "low"
        doers:
          - title: "Trainers"
            descriptions:
              - "Teach AI to a broad range of people"
            ai_expertise: "medium"
        items: [X7, X6]
      ai_solution_delivery:
        ordinal: 3   # NOTE: conflicts with PAC bucket 2; see ADR-9 in roadmap/decisions/resolved_decisions.md
        pac_bucket: 2
        label: "AI Solutions Delivery"
        champions: ["Scott Cook", "Zach Gorman"]
        leaders:
          - title: "Chief engineer"
            descriptions:
              - "Develop, architect, and guide multiple complex AI projects"
              - "Evaluate & manage 3rd-party AI products"
            ai_expertise: "high"
          - title: "Project manager"
            descriptions:
              - "Intake, prioritize, coordinate, and monitor all projects"
              - "Client-facing point of contact"
            ai_expertise: "low"
        doers:
          - title: "Engineer"
            descriptions:
              - "Execute complex AI projects"
            ai_expertise: "high"
          - title: "Operations"
            descriptions:
              - "Deploy, monitor, and support completed projects"
            ai_expertise: "high"
          - title: "Product support"
            descriptions:
              - "Help users effectively leverage 3rd party AI tools (ex: Copilot, AI Builder)"
            ai_expertise: "medium"
        items: [X3, X4, X5, X8, X10, X11, X12, X13, X14, X15, X16, X18, X19, X20]

  capabilities_foundation:
    label: "Provide guidance and guardrails to keep our data and systems safe"
    description: >
      Cross-cutting preconditions that underpin all use-cases. Not sorted by personnel.
      Maps to the PAC docs' "Cross-Cutting Foundations" (rides along, not a fourth bucket).
    leaders:
      - title: "TBD"
    doers:
      - title: "TBD"
    items: [X2, X17]
