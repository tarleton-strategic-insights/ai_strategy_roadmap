# Outcome framework: categorizes each unique_items entry by the strategic objective it
# serves. Sole authoritative definition of outcomes AND membership. This is one of two
# independent categorization axes — see resources.yaml for the other (which resource
# category the work needs). An entry gets exactly one outcome and exactly one
# resource category; the two axes don't have to agree and aren't derived from each other.
# Membership is defined at the unique_items (unique_items.yaml) level, not the raw-item
# level: every unique_items entry (X1, X2, ...) belongs to exactly one outcome.
#
# Set mirrors the three PAC-facing priorities in pac_followup_message.md, plus a catch-all for
# entries that don't serve any of those three directly (e.g. governance, research
# capacity) — added 2026-08-12 so every unique_items entry still lands somewhere.

outcomes:
  curriculum_ai_certificates:
    label: "Ensure AI Literacy for All Tarleton Graduates"
    items: [X1, X9]
  student_retention_success:
    label: "Accelerate Student Retention and Success"
    items: [X3, X15, X16]
  service_operations:
    label: "Enhance Service and Operations Through AI"
    items: [X6, X5, X10, X11, X12, X13, X14, X18, X19, X20]
  governance_foundation:
    label: "Foundations"
    items: [X2, X7, X4, X8, X17]
