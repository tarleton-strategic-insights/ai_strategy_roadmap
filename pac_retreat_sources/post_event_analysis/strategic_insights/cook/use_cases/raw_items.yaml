# Every use-case idea from the PAC retreat flip-chart photos, as structured records.
# id:        provenance ID (source group letter + item number). NEVER renumber.
# group:     source photo group (A-I). Groups are arbitrary (photo/email batching).
# text:      the idea as captured on the flip chart.
# note:      optional; open placement questions flagged with (OPEN).
#
# Category membership lives in categories.yaml; deduplication (which raw items
# collapse into one idea) lives in unique_items.yaml. This file does not carry
# category or dedup fields, so there is nothing here to fall out of sync.

